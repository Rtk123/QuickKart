name: quickkart
description: QuickKart — Blinkit jaisi quick-commerce app (Flutter + Supabase)
publish_to: 'none'
version: 1.0.0+1

environment:
  # 3.6.0 isliye: UI mein `Color.withValues(...)` use hota hai, jo Dart 3.6 /
  # Flutter 3.27 se pehle exist nahi karta. (`RadioGroup` jaisa Flutter 3.32+
  # API jaan-bujhkar avoid kiya gaya hai — dekhein settings_screen.dart.)
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  flutter_dotenv: ^5.1.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  webview_flutter: ^4.8.0
  http: ^1.2.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
